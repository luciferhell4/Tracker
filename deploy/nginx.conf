# Wallet Monitor reverse proxy.
# Copy to /etc/nginx/sites-available/wallet-monitor, symlink into sites-enabled,
# then run: certbot --nginx -d monitor.example.com
server {
    listen 80;
    listen [::]:80;
    server_name monitor.example.com;

    # The dashboard can add and remove wallets and spend your API credits, so
    # it is never exposed unauthenticated. certbot rewrites this block for TLS.
    auth_basic           "Wallet Monitor";
    auth_basic_user_file /etc/nginx/.htpasswd-wallet-monitor;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A first scan of a large watchlist runs for minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
