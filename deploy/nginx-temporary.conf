# Wallet Monitor on a server with no domain yet — reachable at the VPS IP or
# Hostinger's srvNNNNNN.hstgr.cloud hostname.
#
# `server_name _` is a catch-all, so it answers whatever hostname or address
# the request arrived on. TLS uses a self-signed certificate: browsers will
# warn once, but the dashboard password is never sent in clear text, which it
# would be over plain HTTP. Swap in a real certificate once a domain points
# here:  certbot --nginx -d your.domain
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/wallet-monitor.crt;
    ssl_certificate_key /etc/nginx/ssl/wallet-monitor.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The dashboard can add and remove wallets and spend your API credits, so
    # it is never exposed unauthenticated.
    auth_basic           "Wallet Monitor";
    auth_basic_user_file /etc/nginx/.htpasswd-wallet-monitor;

    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A first scan of a large watchlist runs for minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
